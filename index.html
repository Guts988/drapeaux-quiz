<style>
:root{--bg:#eef1f6;--fg:#101828;--card:#fff;--line:#cfd6e2;--acc:#1f3a8a;--ok:#16794a;--okb:#dff3e8;--ko:#b42318;--kob:#fde4e1;--mut:#5b6679;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--fg:#e8ecf4;--card:#192234;--line:#2f3b52;--acc:#7aa2ff;--ok:#4cc88a;--okb:#14352a;--ko:#ff8a7d;--kob:#3b1c1a;--mut:#97a3ba}}
:root[data-theme="dark"]{--bg:#0e1420;--fg:#e8ecf4;--card:#192234;--line:#2f3b52;--acc:#7aa2ff;--ok:#4cc88a;--okb:#14352a;--ko:#ff8a7d;--kob:#3b1c1a;--mut:#97a3ba}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1{font-size:1.8rem;margin:24px 0 6px;letter-spacing:-.01em}
h2{font-size:1.9rem;margin:6px 0 0;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 24px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.mode b{display:block;font-size:1.15rem}
.mode small{color:var(--mut);font-size:.9rem}
.em,.fl,.f .opt{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.em{font-size:2.2rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.st{font-size:.85rem;color:var(--mut);white-space:pre}
.q{text-align:center;margin:20px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.q p{margin:0;color:var(--mut)}
.fl{font-size:96px;line-height:1.15}
.opts{display:grid;gap:10px}
.opts.f{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:1.05rem;min-height:58px}
.f .opt{font-size:56px;line-height:1.2}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.ko{border-color:var(--ko);background:var(--kob)}
.go{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--bg);font-weight:600}
.go.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:1.5rem}
.stats span{color:var(--mut);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{touch-action:manipulation}
</style>
</head>
<body>
<main>
<section id="menu">
<h1>Drapeaux du monde</h1>
<p class="sub">197 pays, 4 choix par question. Une erreur revient quelques questions plus tard, jusqu’à ce qu’elle soit juste.</p>
<button class="mode" data-m="nom"><span class="em">🏳️</span><span><b>Quel pays&nbsp;?</b><small>Je vois le drapeau, je choisis son nom</small></span></button>
<button class="mode" data-m="flag"><span class="em">🌍</span><span><b>Quel drapeau&nbsp;?</b><small>Je vois le nom, je choisis son drapeau</small></span></button>
</section>
<section id="quiz" hidden>
<div class="top"><button class="bk" id="bk" aria-label="Menu">←</button><div class="bar"><i id="pb"></i></div><span class="st" id="st"></span></div>
<div class="q" id="q"></div>
<div class="opts" id="opts"></div>
<button class="go" id="nx" hidden>Suivant</button>
</section>
<section id="end" hidden>
<h1>Terminé 🎉</h1>
<p class="sub">Les 197 pays sont validés.</p>
<div class="stats" id="sx"></div>
<button class="go" id="again">Rejouer</button>
<button class="go alt" id="home">Menu</button>
</section>
</main>
<script>
const RAW="AD Andorre;AE Émirats arabes unis;AF Afghanistan;AG Antigua-et-Barbuda;AL Albanie;AM Arménie;AO Angola;AR Argentine;AT Autriche;AU Australie;AZ Azerbaïdjan;BA Bosnie-Herzégovine;BB Barbade;BD Bangladesh;BE Belgique;BF Burkina Faso;BG Bulgarie;BH Bahreïn;BI Burundi;BJ Bénin;BN Brunei;BO Bolivie;BR Brésil;BS Bahamas;BT Bhoutan;BW Botswana;BY Biélorussie;BZ Belize;CA Canada;CD RD Congo;CF Centrafrique;CG Congo-Brazzaville;CH Suisse;CI Côte d’Ivoire;CL Chili;CM Cameroun;CN Chine;CO Colombie;CR Costa Rica;CU Cuba;CV Cap-Vert;CY Chypre;CZ Tchéquie;DE Allemagne;DJ Djibouti;DK Danemark;DM Dominique;DO République dominicaine;DZ Algérie;EC Équateur;EE Estonie;EG Égypte;ER Érythrée;ES Espagne;ET Éthiopie;FI Finlande;FJ Fidji;FM Micronésie;FR France;GA Gabon;GB Royaume-Uni;GD Grenade;GE Géorgie;GH Ghana;GM Gambie;GN Guinée;GQ Guinée équatoriale;GR Grèce;GT Guatemala;GW Guinée-Bissau;GY Guyana;HN Honduras;HR Croatie;HT Haïti;HU Hongrie;ID Indonésie;IE Irlande;IL Israël;IN Inde;IQ Irak;IR Iran;IS Islande;IT Italie;JM Jamaïque;JO Jordanie;JP Japon;KE Kenya;KG Kirghizistan;KH Cambodge;KI Kiribati;KM Comores;KN Saint-Christophe-et-Niévès;KP Corée du Nord;KR Corée du Sud;KW Koweït;KZ Kazakhstan;LA Laos;LB Liban;LC Sainte-Lucie;LI Liechtenstein;LK Sri Lanka;LR Liberia;LS Lesotho;LT Lituanie;LU Luxembourg;LV Lettonie;LY Libye;MA Maroc;MC Monaco;MD Moldavie;ME Monténégro;MG Madagascar;MH Îles Marshall;MK Macédoine du Nord;ML Mali;MM Birmanie;MN Mongolie;MR Mauritanie;MT Malte;MU Maurice;MV Maldives;MW Malawi;MX Mexique;MY Malaisie;MZ Mozambique;NA Namibie;NE Niger;NG Nigeria;NI Nicaragua;NL Pays-Bas;NO Norvège;NP Népal;NR Nauru;NZ Nouvelle-Zélande;OM Oman;PA Panama;PE Pérou;PG Papouasie-Nouvelle-Guinée;PH Philippines;PK Pakistan;PL Pologne;PS Palestine;PT Portugal;PW Palaos;PY Paraguay;QA Qatar;RO Roumanie;RS Serbie;RU Russie;RW Rwanda;SA Arabie saoudite;SB Îles Salomon;SC Seychelles;SD Soudan;SE Suède;SG Singapour;SI Slovénie;SK Slovaquie;SL Sierra Leone;SM Saint-Marin;SN Sénégal;SO Somalie;SR Suriname;SS Soudan du Sud;ST Sao Tomé-et-Principe;SV Salvador;SY Syrie;SZ Eswatini;TD Tchad;TG Togo;TH Thaïlande;TJ Tadjikistan;TL Timor oriental;TM Turkménistan;TN Tunisie;TO Tonga;TR Turquie;TT Trinité-et-Tobago;TV Tuvalu;TW Taïwan;TZ Tanzanie;UA Ukraine;UG Ouganda;US États-Unis;UY Uruguay;UZ Ouzbékistan;VA Vatican;VC Saint-Vincent-et-les-Grenadines;VE Venezuela;VN Viêt Nam;VU Vanuatu;WS Samoa;XK Kosovo;YE Yémen;ZA Afrique du Sud;ZM Zambie;ZW Zimbabwe";
const A=RAW.split(";").map(s=>({n:s.slice(3),f:String.fromCodePoint(...[...s.slice(0,2)].map(x=>127397+x.charCodeAt(0)))}));
const $=id=>document.getElementById(id),Q=s=>[...document.querySelectorAll(s)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let mode,queue,cur,opts,ok,ko,done,locked,t;
const view=id=>["menu","quiz","end"].forEach(s=>$(s).hidden=s!==id);
const stat=()=>{$("pb").style.width=100*done/A.length+"%";$("st").textContent=done+"/"+A.length+"  ✓"+ok+"  ✗"+ko};
function start(m){mode=m;queue=sh(A);ok=ko=done=0;view("quiz");next()}
function next(){
  clearTimeout(t);
  if(!queue.length){
    $("sx").innerHTML="<div><b>"+ok+"</b><span>justes</span></div><div><b>"+ko+"</b><span>erreurs</span></div><div><b>"+Math.round(100*ok/(ok+ko))+"%</b><span>précision</span></div>";
    return view("end");
  }
  cur=queue.shift();locked=false;
  opts=sh([cur,...sh(A.filter(x=>x!==cur)).slice(0,3)]);
  const n=mode==="nom";
  $("q").innerHTML=n?'<div class="fl" role="img" aria-label="Drapeau à identifier">'+cur.f+'</div><p>Quel est ce pays\u00a0?</p>':'<p>Trouve le drapeau\u00a0:</p><h2>'+cur.n+'</h2>';
  $("opts").className="opts"+(n?"":" f");
  $("opts").innerHTML=opts.map(o=>'<button class="opt">'+(n?o.n:o.f)+'</button>').join("");
  $("nx").hidden=true;
  stat();
}
$("opts").onclick=e=>{
  const b=e.target.closest(".opt");if(!b||locked)return;locked=true;
  const els=Q(".opt"),good=opts[els.indexOf(b)]===cur;
  els[opts.indexOf(cur)].classList.add("ok");
  if(good){ok++;done++;t=setTimeout(next,800)}
  else{b.classList.add("ko");ko++;queue.splice(Math.min(queue.length,4+(Math.random()*4|0)),0,cur);$("nx").hidden=false}
  stat();
};
$("nx").onclick=next;
$("bk").onclick=()=>{clearTimeout(t);view("menu")};
$("again").onclick=()=>start(mode);
$("home").onclick=()=>view("menu");
Q(".mode").forEach(b=>b.onclick=()=>start(b.dataset.m));
document.onkeydown=e=>{
  if($("quiz").hidden)return;
  if(e.key>="1"&&e.key<="4"){const b=Q(".opt")[e.key-1];if(b)b.click()}
  else if(e.key==="Enter"&&!$("nx").hidden){e.preventDefault();next()}
};
</script>
</body>
</html>
